name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Syntax check
        run: |
          find src scripts -type f \( -name "*.js" -o -name "*.mjs" \) -print0 \
            | xargs -0 -n1 node --check
      - name: Unit tests (offline)
        run: npm test
      - name: Self-test (offline)
        run: npm run selftest:offline

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create decoy secrets and state
        run: |
          printf 'SECRET=must-not-be-in-image\n' > .env
          mkdir -p sessions data node_modules
          printf 'session-secret\n' > sessions/creds.json
          printf 'database-secret\n' > data/database.json
          printf 'host-dependency\n' > node_modules/decoy.txt
      - name: Build image
        run: docker build -t wabot-aq:ci .
      - name: Verify image excludes secrets and runtime state
        run: |
          docker run --rm wabot-aq:ci sh -c '
            set -eu
            for path in .env tests .git node_modules/decoy.txt sessions/creds.json data/database.json; do
              if [ -e "/app/$path" ]; then
                echo "unexpected file in image: $path"
                exit 1
              fi
            done
            test -d /app/node_modules
            echo "image contents ok: no decoy secrets or host files"
          '
